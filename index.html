<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC_C_017_5B - Habilitación para la Docencia</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#eef2ff;color:#222}
header{background:linear-gradient(90deg,#1e40af,#2563eb,#3b82f6);color:white;padding:28px 16px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:8px 0 0;color:#dbeafe;font-size:14px}
main{max-width:900px;margin:auto;padding:16px}
.boton-volver{display:inline-block;background:white;color:#2563eb;padding:10px 16px;border-radius:20px;font-weight:bold;text-decoration:none;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.modulo-titulo{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);border-left:8px solid #2563eb}
.modulo-titulo h2{margin:0;color:#1e40af;font-size:20px}
.modulo-titulo p{margin:6px 0 0;color:#666;font-size:14px}
.tarjeta{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;display:flex;gap:14px;align-items:center}
.tarjeta:hover{transform:scale(1.01)}
.icono-principal{font-size:48px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;border-radius:16px;flex-shrink:0}
.c1{background:#dbeafe}.c2{background:#ffedd5}.c3{background:#dcfce7}.c4{background:#e9d5ff}.c5{background:#fef9c3}.c6{background:#fee2e2}.c7{background:#ccfbf1}.c8{background:#fce7f3}
.tarjeta-texto{flex:1}
.tarjeta h3{margin:0;color:#1e40af;font-size:18px}
.tarjeta p{margin:6px 0 0;color:#666;font-size:14px}
.ua{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.ua-icono{font-size:38px}
.ua-texto{flex:1}
.ua h3{margin:0;color:#1e40af;font-size:17px}
.ua p{margin:6px 0 12px;color:#666;font-size:14px}
.ua-body{display:none;border-top:1px solid #eee;padding-top:12px}
.ua-body.open{display:block}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{border:0;background:#e0e7ff;color:#1e40af;padding:9px 12px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px}
.tabs button.active{background:#2563eb;color:white}
.panel{display:none;background:#f8fafc;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.panel.active{display:block}
.panel a{display:inline-block;background:#2563eb;color:white;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:bold;margin-top:8px}
.icono-grande{font-size:36px}
footer{text-align:center;padding:20px;color:#888;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🎓 SSC_C_017_5B - Habilitación para la Docencia</h1>
<p>📚 Grados A, B y C - 510 h - 👩‍🏫 Angélica Agudo Polo<br>👆 Pincha en un módulo para entrar</p>
</header>
<main id="contenido"></main>
<footer>🎨 Página principal con dibujos y colores</footer>
<script>
const LINK_DRIVE = "https://drive.google.com/drive/folders/1cR5V9gbefH-fNEe8TubGIt4SwPA9DReC?usp=drive_link";
const MANUAL_MP1706_UA2 = "MP1706/UA2_Diseño y adaptación de materiales didácticos.docx.pdf";
const ICONOS = ["📚","✏️","💻","🎯","🧑‍🏫","🌟","📖","🎨"];
const MODULOS = [
{codigo:"MP1705", nombre:"Programación Didáctica de los grados A, B y C", icono:"📘", color:"c1", desc:"📝 Aprende a programar tus clases - 5 unidades", uas:[
["El Sistema de Formación Profesional y su marco normativo","📜 Introducción al sistema y su normativa."],
["Organización curricular de los grados A, B y C","🗂️ Cómo se organizan los grados A, B y C."],
["Coordinación docente y organización de la acción formativa","🤝 Coordinación y organización de la formación."],
["Diseño de la programación didáctica","✍️ Cómo diseñar tu programación."],
["Temporalización y planificación de la acción formativa","🗓️ Temporalizar y planificar la formación."]]},
{codigo:"MP1706", nombre:"Gestión de materiales, medios y recursos didácticos", icono:"🧰", color:"c2", desc:"✂️ Crea y elige tus materiales - 5 unidades", uas:[
["Introducción a los materiales didácticos","📦 Concepto, tipos y criterios de selección."],
["Elaboración y adaptación de materiales","✂️ Unidad que estás impartiendo ahora. Elaboración, adaptación y uso de medios."],
["Medios y recursos tecnológicos","💻 Recursos TIC, audiovisuales y digitales para el aula."],
["Utilización de materiales, medios técnicos y recursos audiovisuales","🎬 Uso práctico en el aula."],
["Evaluación de materiales, medios y recursos didácticos","✅ Cómo evaluar si el material funciona."]]},
{codigo:"MP1707", nombre:"Orientación profesional", icono:"🧭", color:"c3", desc:"💼 Ayuda a buscar empleo - 6 unidades", uas:[
["El Sistema de Formación Profesional y las oportunidades de desarrollo profesional","🌱 Oportunidades del sistema."],
["El mercado laboral y las oportunidades de empleo","💼 Conoce el mercado laboral."],
["Herramientas para la búsqueda activa de empleo","🔍 Herramientas para buscar empleo."],
["Diseño del itinerario profesional y desarrollo de la empleabilidad","🛤️ Diseña tu itinerario."],
["Orientación profesional, igualdad e inclusión en el acceso al empleo","❤️ Igualdad e inclusión."],
["Sostenibilidad y retos ambientales y sociales en el entorno profesional","🌍 Sostenibilidad en lo profesional."]]},
{codigo:"MP1783", nombre:"Evaluación del proceso de enseñanza-aprendizaje", icono:"📊", color:"c4", desc:"⭐ Cómo evaluar y calificar - 7 unidades", uas:[
["Normativa y características de la evaluación en los grados A, B y C","📏 Normativa de evaluación."],
["Planificación del proceso de evaluación","🗓️ Cómo planificar la evaluación."],
["Técnicas e instrumentos de evaluación","🧪 Técnicas e instrumentos."],
["Diseño y elaboración de instrumentos de evaluación","✏️ Diseña tus instrumentos."],
["Evaluación y calificación de los aprendizajes","⭐ Evaluar y calificar."],
["Evaluación de la calidad del proceso de enseñanza-aprendizaje","🏆 Calidad del proceso."],
["Análisis de resultados y mejora del proceso de enseñanza-aprendizaje","📈 Mejora con los resultados."]]},
{codigo:"MP1784", nombre:"Procesos para impartir acciones formativas", icono:"👩‍🏫", color:"c5", desc:"💬 Cómo dar clase y comunicar - 6 unidades", uas:[
["Desarrollo de estrategias facilitadoras del proceso de aprendizaje","💡 Estrategias que facilitan aprender."],
["Cohesión y participación activa del alumnado","🤗 Cohesión y participación."],
["Técnicas de comunicación en las acciones formativas","💬 Comunicar en el aula."],
["Estrategias metodológicas para la impartición de acciones formativas","🎯 Metodologías para impartir."],
["Aspectos psicopedagógicos del aprendizaje","🧠 Cómo aprendemos."],
["Atención personalizada y seguimiento del aprendizaje","👀 Seguimiento personalizado."]]},
{codigo:"MP1785", nombre:"Acción tutorial", icono:"🤝", color:"c6", desc:"❤️ Acompaña a tu alumnado - 6 unidades", uas:[
["Condiciones y requisitos iniciales de las acciones formativas","📋 Requisitos iniciales."],
["La función tutorial en el proceso de enseñanza-aprendizaje","🧑‍🏫 Qué es la tutoría."],
["Técnicas y herramientas de tutorización y seguimiento","🧰 Herramientas de tutoría."],
["Estrategias didácticas y comunicación para la participación","💬 Participación y comunicación."],
["Acción tutorial y formación dual en la empresa","🏢 Tutoría en la empresa."],
["Requisitos de superación, evaluación y valoración del progreso","✅ Superación y progreso."]]},
{codigo:"MP1786", nombre:"Competencia digital para la práctica docente", icono:"💻", color:"c7", desc:"🖥️ Tecnología para dar clase - 3 unidades", uas:[
["Comunicación, colaboración, búsqueda y gestión de información y contenidos digitales","🔎 Buscar y gestionar información digital."],
["Tecnologías digitales aplicadas a la enseñanza, el aprendizaje y la evaluación","🖥️ Tecnología en el aula y en la evaluación."],
["Accesibilidad, inclusión, alfabetización mediática, seguridad y bienestar digital","🔒 Accesibilidad y seguridad digital."]]},
{codigo:"PRACTICAS", nombre:"Prácticas / Formación en Empresa", icono:"🏢", color:"c8", desc:"🏭 Prácticas en empresa - 2 unidades", uas:[
["Información general de prácticas","ℹ️ Información general."],
["Documentación y seguimiento","📂 Documentación y seguimiento."]]}
];
let moduloActivo = -1;
const contenido = document.getElementById("contenido");
function pintarInicio(){
  let html = "";
  MODULOS.forEach((m,i)=>{
    html += `<div class="tarjeta" onclick="moduloActivo=${i};pintarModulo();"><div class="icono-principal ${m.color}">${m.icono}</div><div class="tarjeta-texto"><h3>${m.codigo} - ${m.nombre}</h3><p>${m.desc} 👉 Pincha para entrar</p></div><div style="font-size:24px">➡️</div></div>`;
  });
  contenido.innerHTML = html;
  window.scrollTo(0,0);
}
function pintarModulo(){
  const m = MODULOS[moduloActivo];
  let html = `<a class="boton-volver" href="#" onclick="pintarInicio();return false;">⬅️ Volver a todos los módulos</a><div class="modulo-titulo"><h2>${m.icono} ${m.codigo} - ${m.nombre}</h2><p>📁 ${m.uas.length} unidades - Pulsa en cada unidad para abrirla 👇</p></div>`;
  m.uas.forEach((ua, idx)=>{
    let id = m.codigo + "-" + idx;
    let icono = ICONOS[idx % ICONOS.length];
    let manualHTML = "";
    if(m.codigo==="MP1706" && idx===1){
      manualHTML = `<div class="icono-grande">📘📚</div><b>Manual - Unidad 2 - Ya subido</b><br>Este es el manual de Elaboración y adaptación de materiales.<br><br><a href="${encodeURI(MANUAL_MP1706_UA2)}" target="_blank">📘 ➡️ Pincha aquí para abrir el manual</a><br><br>Si no se abre, dale a descargar.`;
    } else {
      manualHTML = `<div class="icono-grande">📘📚</div><b>Manual - En el repositorio</b><br>Aquí va solo el manual de esta unidad, subido al repositorio.`;
    }
    html += `<div class="ua" onclick="document.getElementById('body-${id}').classList.toggle('open')">
      <div class="ua-icono">${icono}</div>
      <div class="ua-texto">
      <h3>📁 Unidad ${idx+1} - ${ua[0]}</h3>
      <p>${ua[1]}</p>
      <div class="ua-body" id="body-${id}" onclick="event.stopPropagation()">
        <div class="tabs">
          <button class="active" onclick="mostrarPanel(event,'${id}','fichas')">📄 Fichas</button>
          <button onclick="mostrarPanel(event,'${id}','manual')">📘 Manual</button>
          <button onclick="mostrarPanel(event,'${id}','presentacion')">🎨 Presentación</button>
          <button onclick="mostrarPanel(event,'${id}','entregar')">📤 Entregar actividades</button>
          <button onclick="mostrarPanel(event,'${id}','corregidas')">✅ Actividades corregidas</button>
        </div>
        <div class="panel active" id="${id}-fichas"><div class="icono-grande">📄📝</div><b>Fichas - En el repositorio</b><br>Aquí van las fichas de esta unidad, subidas al repositorio.<br><br>Ejemplo: 📄 Ficha ${idx+1} - Sesión ${idx+1}.pdf</div>
        <div class="panel" id="${id}-manual">${manualHTML}</div>
        <div class="panel" id="${id}-presentacion"><div class="icono-grande">🎨🖥️</div><b>Presentación - En el repositorio</b><br>Aquí va solo la presentación de esta unidad, subida al repositorio.</div>
        <div class="panel" id="${id}-entregar"><div class="icono-grande">📤✉️</div><b>Entregar actividades - En Drive</b><br>Entra en tu carpeta con tu nombre y sube ahí tu actividad sin corregir.<br><br><a href="${LINK_DRIVE}" target="_blank">📤 ➡️ Pincha aquí para entregar</a><br><br>Verás la lista con los nombres de todos, pero solo puedes abrir tu carpeta.</div>
        <div class="panel" id="${id}-corregidas"><div class="icono-grande">✅⭐</div><b>Actividades corregidas - En Drive</b><br>Entra en tu carpeta con tu nombre y ahí estará tu actividad ya corregida.<br><br><a href="${LINK_DRIVE}" target="_blank">✅ ➡️ Pincha aquí para ver tu actividad corregida</a><br><br>Busca tu nombre: 👩 María, 👩 Lourdes, 👨 Oscar, 👩 Piedad, 👨 Jonathan, 👩 Isabel, 👨 Sergio, 👩 Nuria, 👨 Juan Luis...</div>
      </div>
      </div>
    </div>`;
  });
  contenido.innerHTML = html;
  window.scrollTo(0,0);
}
function mostrarPanel(e, id, cual){
  e.stopPropagation();
  let botones = e.target.parentElement.querySelectorAll("button");
  botones.forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  ["fichas","manual","presentacion","entregar","corregidas"].forEach(k=>{
    document.getElementById(id+"-"+k).classList.remove("active");
  });
  document.getElementById(id+"-"+cual).classList.add("active");
}
pintarInicio();
</script>
</body>
</html>
